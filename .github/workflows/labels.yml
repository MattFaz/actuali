name: labels

# issue_comment isn't restricted to write-access actors like pull_request is,
# so this lets anyone trigger an AI review via comment without needing the
# "add labels" repo permission themselves.
on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  ai-review-label:
    if: >-
      github.repository == 'MattFaz/actuali' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/ai-review'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label ai-review
