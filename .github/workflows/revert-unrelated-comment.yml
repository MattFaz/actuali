name: Revert unrelated search comment change

on:
  push:
    branches:
      - All-Transactions-Search

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: All-Transactions-Search
          fetch-depth: 0
      - name: Revert unrelated comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Actuali/Actuali/Services/Database/BudgetDatabase.swift')
          text = path.read_text()
          marker = "income = budgeted amounts across"
          start = text.find(marker)
          if start == -1:
              raise SystemExit('Expected unrelated comment not found')
          line_start = text.rfind('\n', 0, start) + 1
          block_end = text.find('\n', text.find('\n', start) + 1) + 1
          lines = text[line_start:block_end].splitlines(keepends=True)
          replacement = ''.join(
              ('                // tracking `total-saved`: budgeted income minus budgeted\n',
               '                // expenses for the month (loot-core tracking.ts).\n')
          )
          path.write_text(text[:line_start] + replacement + text[block_end:])
          workflow = Path('.github/workflows/revert-unrelated-comment.yml')
          workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Actuali/Actuali/Services/Database/BudgetDatabase.swift .github/workflows/revert-unrelated-comment.yml
          git diff --cached --check
          git commit -m "chore: revert unrelated comment change"
          git push origin All-Transactions-Search
