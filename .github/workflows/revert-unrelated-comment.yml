name: Revert unrelated search comment change

on:
  push:
    branches:
      - All-Transactions-Search

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: All-Transactions-Search
          fetch-depth: 0
      - name: Revert unrelated comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Actuali/Actuali/Services/Database/BudgetDatabase.swift')
          text = path.read_text()
          old = '''                // tracking `total-saved`: income = budgeted amounts across
                // income categories, expenses = across the rest (loot-core tracking.ts).
          '''
          new = '''                // tracking `total-saved`: budgeted income minus budgeted
                // expenses for the month (loot-core tracking.ts).
          '''
          if old not in text:
              raise SystemExit('Expected unrelated comment not found')
          path.write_text(text.replace(old, new, 1))
          workflow = Path('.github/workflows/revert-unrelated-comment.yml')
          workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Actuali/Actuali/Services/Database/BudgetDatabase.swift .github/workflows/revert-unrelated-comment.yml
          git diff --cached --check
          git commit -m "chore: revert unrelated comment change"
          git push origin All-Transactions-Search
