# UI tests, nightly rather than per-PR: the suite takes ~50 minutes, which is
# too slow to gate a PR on. Run it by hand from the Actions tab (or with
# `gh workflow run ui-tests.yml --ref <branch>`) when a change touches the
# flows it covers.
name: UI Tests

on:
  schedule:
    # 14:00 UTC — midnight AEST, so the run is finished by the morning.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-test:
    if: github.repository == 'MattFaz/actuali'
    name: UI Tests (iOS 27)
    # Same image as ci.yml's unit tests: the widgets use the iOS 27 SDK
    # (systemExtraLargePortrait), which Xcode 26 on macos-26 can't compile.
    runs-on: xcode-27
    # Serial execution costs wall-clock (see the test step): budget for a
    # ~90 min green run plus retries. Nothing waits on this job overnight.
    timeout-minutes: 180
    env:
      RUNTIME: "27.2"
    steps:
      - uses: actions/checkout@v7

      # Same Xcode pin as ci.yml, for the same reason: stop the default
      # Xcode's CoreSimulatorService so the first simctl call starts 27.2's.
      - run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcrun simctl shutdown all || true
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true

      # Same runtime pin as ci.yml: a fresh device on the image's preinstalled
      # iOS 27.2, never a download (runner-images #15374). The exact
      # identifier skips the separate iOS 27.2 runtime that only runs iPhone
      # Duo. Created here but booted below, after the keyboard pref.
      - name: Create iOS ${{ env.RUNTIME }} simulator
        id: sim
        run: |
          RT="com.apple.CoreSimulator.SimRuntime.iOS-${RUNTIME//./-}"
          if ! xcrun simctl list runtimes --json | jq -e --arg rt "$RT" '.runtimes[] | select(.identifier == $rt and .isAvailable)' > /dev/null; then
            echo "::error::Runtime $RT is not installed on this image"
            xcrun simctl list runtimes >&2
            exit 1
          fi
          DEVICE_TYPE=$(xcrun simctl list runtimes --json \
            | jq -r --arg rt "$RT" '[.runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes[] | select(.productFamily == "iPhone")][0].identifier')
          SIM_ID=$(xcrun simctl create ci-ui-ios27 "$DEVICE_TYPE" "$RT")
          echo "::notice::Created $SIM_ID ($DEVICE_TYPE, $RT)"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      # A connected hardware keyboard makes the simulator minimize the
      # software keyboard, so keypad taps land on off-screen keys; the tests
      # drive budget amounts through the keypad. This host-side pref only
      # protects a device that has never seen a hardware keyboard (true for
      # fresh runner sims) — a device that already remembers one needs its
      # device-side com.apple.keyboard.preferences reset instead. It is keyed
      # by UDID, so it only reaches the device the tests actually run on now
      # that parallel testing (which clones the device under new UDIDs) is off.
      - name: Disable simulator hardware keyboard
        run: |
          defaults write com.apple.iphonesimulator DevicePreferences \
            -dict-add "${{ steps.sim.outputs.id }}" \
            "<dict><key>ConnectHardwareKeyboard</key><false/></dict>"

      # Left to xcodebuild, the device boots cold under the first suite, and
      # its first launches time out or fail to terminate while the fresh
      # device is still settling (runs 40410828647, 40427741563). Boot it
      # here, after the keyboard pref. As in ci.yml, bootstatus can exit 0 on
      # "Data Migration Failed", so require its terminal "Finished" status.
      - name: Boot simulator
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b | tee "$RUNNER_TEMP/bootstatus.log"
          if ! grep -q 'Status=4294967295' "$RUNNER_TEMP/bootstatus.log"; then
            echo "::error::Simulator ${{ steps.sim.outputs.id }} did not finish booting"
            xcrun simctl list devices >&2
            exit 1
          fi

      # Runs serially on the one simulator. Two parallel workers halved the
      # test phase but ran two sim clones on a 3-core runner, and the
      # contention timed out XCTest's own machinery rather than the tests:
      # kAXErrorIPCTimeout listing apps at `launch()`, background-assertion
      # timeouts, "Timed out while evaluating UI query", single taps waiting
      # 35s for the app to idle (run 32860255135). Retries still cover a
      # genuine one-off, but they can't rescue a host that's out of CPU.
      - name: Build and run UI tests on iOS ${{ env.RUNTIME }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Actuali/Actuali.xcodeproj \
            -scheme Actuali \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:ActualiUITests \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults/ActualiUITests.xcresult \
            | xcbeautify --quiet

      # The tests attach screenshots at each checkpoint; keep them (and the
      # full activity log) when a run fails on the runner but not locally.
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7
