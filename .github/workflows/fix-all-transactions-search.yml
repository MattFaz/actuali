name: Apply transaction search review fixes

on:
  push:
    branches:
      - All-Transactions-Search

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: All-Transactions-Search

      - name: Apply minimal search fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          budget = Path('Actuali/Actuali/Services/Database/BudgetDatabase.swift')
          text = budget.read_text()

          old = '''                    var clauses = [
                        "\\(payeeNameSQL) LIKE ? ESCAPE '\\\\'",
                        "c.name LIKE ? ESCAPE '\\\\'",
                        "t.notes LIKE ? ESCAPE '\\\\'",
                        "t.imported_description LIKE ? ESCAPE '\\\\'"
                    ]

                    arguments.append(contentsOf: [pattern, pattern, pattern, pattern])

                    clauses.append("""
                        EXISTS (
                            SELECT 1
                            FROM transactions child
                            LEFT JOIN payee_mapping child_pm
                                ON child_pm.id = child.description
                            LEFT JOIN payees child_payee
                                ON child_payee.id = child_pm.targetId
                            LEFT JOIN category_mapping child_cm
                                ON child_cm.id = child.category
                            LEFT JOIN categories child_category
                                ON child_category.id = COALESCE(
                                    child_cm.transferId,
                                    child.category
                                )
                            WHERE child.parent_id = t.id
                              AND (child.tombstone = 0 OR child.tombstone IS NULL)
                              AND (
                                  child_payee.name LIKE ? ESCAPE '\\\\'
                                  OR child.notes LIKE ? ESCAPE '\\\\'
                                  OR child_category.name LIKE ? ESCAPE '\\\\'
                                  OR child.imported_description LIKE ? ESCAPE '\\\\'
                              )
                        )
                    """)

                    arguments.append(contentsOf: [pattern, pattern, pattern, pattern])
'''

          new = '''                    var clauses = [
                        "\\(payeeNameSQL) LIKE ? ESCAPE '\\\\'",
                        "c.name LIKE ? ESCAPE '\\\\'",
                        "t.notes LIKE ? ESCAPE '\\\\'"
                    ]

                    arguments.append(contentsOf: [pattern, pattern, pattern])

                    clauses.append("""
                        // ponytail: Keep split-child matching in SQL so pagination still
                        // spans full history; the correlated EXISTS only probes children
                        // belonging to the current parent row.
                        EXISTS (
                            SELECT 1
                            FROM transactions child
                            LEFT JOIN payee_mapping cpm ON cpm.id = child.description
                            LEFT JOIN payees cpay ON cpay.id = cpm.targetId
                            LEFT JOIN category_mapping ccm ON ccm.id = child.category
                            LEFT JOIN categories ccat ON ccat.id = COALESCE(ccm.transferId, child.category)
                            WHERE child.parent_id = t.id
                              AND (child.tombstone = 0 OR child.tombstone IS NULL)
                              AND (
                                  cpay.name LIKE ? ESCAPE '\\\\'
                                  OR ccat.name LIKE ? ESCAPE '\\\\'
                                  OR child.notes LIKE ? ESCAPE '\\\\'
                              )
                        )
                    """)

                    arguments.append(contentsOf: [pattern, pattern, pattern])
'''

          if old not in text:
              raise SystemExit('Expected BudgetDatabase search block not found')
          budget.write_text(text.replace(old, new, 1))

          tests = Path('Actuali/ActualiTests/Services/Database/BudgetDatabaseTransactionPagingSearchTests.swift')
          text = tests.read_text()

          old = '''    @Test func searchMatchesSplitChildPayeeAndNotes() async throws {
        let (db, url) = try makeDatabase()
        defer { cleanup(url) }
        try await seedLookups(db)

        // The split parent has no own payee or note. Its children have
        // different payees, so the existing parent-payee resolution cannot
        // surface either child individually; both searches must still return
        // the parent row.
        try await db.dbQueueForTesting.write { conn in
            try conn.execute(sql: """
                INSERT INTO transactions (id, acct, description, amount, notes, date, isParent, isChild, parent_id, sort_order) VALUES
                    ('parent', 'acct-1', NULL,          -10000, NULL,              20260602, 1, 0, NULL,     3),
                    ('c-1',    'acct-1', 'payee-cafe',   -6000,  'weekly groceries', 20260602, 0, 1, 'parent', 2),
                    ('c-2',    'acct-1', 'payee-market', -4000,  'cleaning supplies', 20260602, 0, 1, 'parent', 1);
            """)
        }

        let byChildPayee = try await db.fetchTransactions(search: "cafe")
        #expect(byChildPayee.map(\\.id) == ["parent"])

        let byChildNote = try await db.fetchTransactions(search: "cleaning")
        #expect(byChildNote.map(\\.id) == ["parent"])
    }
'''

          new = '''    @Test func searchMatchesSplitChildPayeeNotesAndCategory() async throws {
        let (db, url) = try makeDatabase()
        defer { cleanup(url) }
        try await seedLookups(db)

        // The split parent has no own payee, note, or category. Its children
        // have different payees, so the existing parent-payee resolution cannot
        // surface either child individually; all child fields must still match.
        try await db.dbQueueForTesting.write { conn in
            try conn.execute(sql: """
                INSERT INTO transactions (id, acct, description, category, amount, notes, date, isParent, isChild, parent_id, sort_order) VALUES
                    ('parent', 'acct-1', NULL,           NULL,      -10000, NULL,               20260602, 1, 0, NULL,     3),
                    ('c-1',    'acct-1', 'payee-cafe',   'cat-food', -6000,  'weekly groceries',  20260602, 0, 1, 'parent', 2),
                    ('c-2',    'acct-1', 'payee-market', 'cat-fun',  -4000,  'cleaning supplies', 20260602, 0, 1, 'parent', 1);
            """)
        }

        let byChildPayee = try await db.fetchTransactions(search: "cafe")
        #expect(byChildPayee.map(\\.id) == ["parent"])

        let byChildNote = try await db.fetchTransactions(search: "cleaning")
        #expect(byChildNote.map(\\.id) == ["parent"])

        let byChildCategory = try await db.fetchTransactions(search: "fun")
        #expect(byChildCategory.map(\\.id) == ["parent"])
    }
'''

          if old not in text:
              raise SystemExit('Expected split-child test block not found')
          tests.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Actuali/Actuali/Services/Database/BudgetDatabase.swift Actuali/ActualiTests/Services/Database/BudgetDatabaseTransactionPagingSearchTests.swift
          git diff --cached --check
          git commit -m "fix: tighten split transaction search"
          git push origin All-Transactions-Search
