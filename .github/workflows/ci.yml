# Builds the app and runs unit tests on every PR that touches app code. Branch
# protection requires the "Unit Tests (iOS 26)" check plus "Unit Tests Gate",
# which fails on drafts because the test job skips there and a skipped job
# still reads as passing. ci-noop.yml provides the same check names for PRs
# that don't touch app code. UI tests are too slow to gate a PR (~50 min) —
# they run nightly in ui-tests.yml.
name: CI

on:
  pull_request:
    branches: [main]
    # The defaults plus ready_for_review: the test jobs skip draft PRs, so
    # leaving draft has to start the run that a push would otherwise wait for.
    types: [opened, synchronize, reopened, ready_for_review]
    # The whole workflows directory rather than this file and its noop twin:
    # naming files individually means ci-noop.yml's paths-ignore has to be kept
    # in lockstep, and any file missed from both fires *both* workflows, which
    # reports each required check twice — a 5-second ubuntu noop can then
    # satisfy a check the real macOS job is still running.
    paths:
      - "Actuali/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Rapid pushes to the same PR cancel the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The test jobs below skip draft PRs, and GitHub treats a skipped job as a
  # passing check: without this gate a draft's head commit satisfies the
  # required checks with nothing run, and keeps that green in the moment
  # between ready_for_review and the new run's checks registering. Failing on
  # drafts keeps the commit red until the real run replaces it. It only counts
  # once listed in the required checks; ci-noop.yml reports the same name for
  # PRs that don't touch app code.
  tests-gate:
    name: Unit Tests Gate
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.pull_request.draft }}
        run: |
          echo "Draft PR: unit tests were skipped. Mark it ready for review to run them." >&2
          exit 1

  # Fails the PR if Swift code isn't formatted per .swiftformat. Kept as its
  # own job (not folded into the test jobs) so branch protection can require
  # "SwiftFormat" by name. ci-noop.yml reports the same check for PRs that
  # don't touch app code.
  # Pinned release artifact: brew's rolling latest once added default-on rules
  # (0.64.0 did) and reddened every open PR. Upgrading is now deliberate:
  # bump the version here, `brew upgrade swiftformat && swiftformat Actuali`
  # locally (brew pin swiftformat holds local to the same release), and land
  # the mechanical reformat in the same PR.
  swiftformat:
    name: SwiftFormat
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTFORMAT_VERSION: 0.64.0
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o swiftformat.zip
      - run: ./swiftformat --lint --strict Actuali

  # Skipped on draft PRs: a draft can't merge, and each push to one would
  # otherwise spend a macOS test run on work in progress. SwiftFormat still
  # runs there, since it's quick; tests-gate above is what keeps the skip from
  # reading as a pass. The negation keeps workflow_dispatch running: there is
  # no PR there, and `!null` is true.
  #
  # One leg per pinned runtime. The iOS 18 leg (the IPHONEOS_DEPLOYMENT_TARGET
  # floor) is dropped for now: Xcode 27.2 can't download any iOS 18 simulator
  # runtime, so it can't run on the xcode-27 image. Re-add it to the matrix
  # once a runner can provide one. The names are the required checks, so they
  # must stay "Unit Tests (iOS N)".
  # fail-fast off: each leg reports on its own, as separate jobs did.
  test:
    name: Unit Tests (iOS ${{ matrix.ios }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            download: "26.5"
    # Xcode 27 image: the widgets use the iOS 27 SDK (systemExtraLargePortrait),
    # which Xcode 26 lacks, and Xcode 27 needs macOS 26.6+, so neither macos-26
    # nor macos-15 can build them. The image ships only iOS 27 runtimes, so
    # each leg downloads its own (~9 GB, a few minutes).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The image defaults to an older Xcode 27; pin the release used locally
      # so CI and local builds compile with the same SDK. Switching leaves the
      # default Xcode's CoreSimulatorService running, and xcodebuild swaps it
      # for 27.2's mid-run — the likely cause of the service hub dying and the
      # test host crashing before it connected. Stop it so the first simctl
      # call below starts 27.2's.
      - run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcrun simctl shutdown all || true
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true

      # Always a fresh device, created only once the runtime is available and
      # booted before xcodebuild sees it. The download registers default
      # devices while the runtime is still mounting; picking one of those gave
      # a device whose runtime xcodebuild read as (null), so no test ran.
      - name: Boot iOS ${{ matrix.ios }} simulator
        id: sim
        timeout-minutes: 30
        env:
          IOS: ${{ matrix.ios }}
          DOWNLOAD: ${{ matrix.download }}
        run: |
          runtime() {
            xcrun simctl list runtimes --json \
              | jq -r --arg ios "iOS-$IOS-" '[.runtimes[] | select(.isAvailable) | select(.identifier | contains($ios))][0].identifier // empty'
          }
          RT=$(runtime)
          if [ -z "$RT" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$DOWNLOAD"
            # The runtime mounts asynchronously after the download returns.
            for _ in $(seq 60); do
              RT=$(runtime)
              [ -n "$RT" ] && break
              sleep 5
            done
          fi
          if [ -z "$RT" ]; then
            echo "No iOS $IOS runtime available and the download did not provide one" >&2
            xcrun simctl runtime list >&2
            exit 1
          fi
          # A downloaded runtime has no dyld shared cache yet. CoreSimulator
          # builds it in the background, and a first boot racing that build
          # sat in "Waiting on Data Migration" for 8+ minutes and never came
          # up (15+ locally, with the cache still unbuilt). Building it first
          # takes ~4 minutes and brings the boot down to ~3.
          xcrun simctl runtime dyld_shared_cache update "$RT"
          # From the runtime's own supported list: the image's newest iPhone
          # device types don't run on older runtimes.
          DEVICE_TYPE=$(xcrun simctl list runtimes --json \
            | jq -r --arg rt "$RT" '[.runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes[] | select(.productFamily == "iPhone")][0].identifier')
          SIM_ID=$(xcrun simctl create "ci-ios$IOS" "$DEVICE_TYPE" "$RT")
          # The device reads as Booted while still migrating, and bootstatus
          # can exit 0 on "Data Migration Failed", so require its terminal
          # "Finished" status (4294967295) as well.
          xcrun simctl bootstatus "$SIM_ID" -b | tee "$RUNNER_TEMP/bootstatus.log"
          STATE=$(xcrun simctl list devices --json \
            | jq -r --arg rt "$RT" --arg id "$SIM_ID" '.devices[$rt][]? | select(.udid == $id) | .state')
          if [ "$STATE" != "Booted" ] || ! grep -q 'Status=4294967295' "$RUNNER_TEMP/bootstatus.log"; then
            echo "::error::Simulator $SIM_ID on $RT is '${STATE:-missing}' and did not finish booting"
            xcrun simctl list devices >&2
            exit 1
          fi
          echo "::notice::Booted $SIM_ID ($DEVICE_TYPE, $RT)"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      # UI tests run nightly in ui-tests.yml so the PR signal stays fast.
      # Simulator builds are ad-hoc signed, so no certificate is needed —
      # but don't pass CODE_SIGNING_ALLOWED=NO: an unsigned test host can't
      # reach the simulator keychain (errSecMissingEntitlement in
      # EncryptionKeyManager tests).
      # xcbeautify (preinstalled on macOS runners) keeps the log readable;
      # --quiet drops passing-task noise but keeps warnings and errors;
      # pipefail preserves xcodebuild's exit code through the pipe.
      # The result bundle then proves what ran: the job fails unless tests ran
      # on an iOS N device, and the counts land as an annotation on the check.
      - name: Build and run unit tests on iOS ${{ matrix.ios }}
        env:
          IOS: ${{ matrix.ios }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Actuali/Actuali.xcodeproj \
            -scheme Actuali \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -testLanguage en \
            -testRegion US \
            -skip-testing:ActualiUITests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            | xcbeautify --quiet
          SUMMARY=$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/unit.xcresult")
          OS=$(jq -r '.devicesAndConfigurations[0].device.osVersion' <<< "$SUMMARY")
          TOTAL=$(jq -r '.totalTestCount' <<< "$SUMMARY")
          echo "::notice::$(jq -r '"\(.passedTests) of \(.totalTestCount) tests passed (\(.failedTests) failed, \(.skippedTests) skipped) on \(.devicesAndConfigurations[0].device | "\(.modelName), iOS \(.osVersion) (\(.osBuildNumber))")"' <<< "$SUMMARY")"
          if [[ "$OS" != "$IOS".* ]] || [ "$TOTAL" -eq 0 ]; then
            echo "::error::Expected unit tests on iOS $IOS, got $TOTAL tests on iOS $OS"
            exit 1
          fi

      # Tells a test failure apart from the runtime or device going away under
      # it (runner-images #15374), on the check page itself.
      - name: Simulator state on failure
        if: failure() && steps.sim.outputs.id
        run: |
          echo "::error::Runtimes: $(xcrun simctl list runtimes | grep 'iOS ${{ matrix.ios }}\.' | tr '\n' ' ')"
          echo "::error::Device: $(xcrun simctl list devices | grep '${{ steps.sim.outputs.id }}' || echo '${{ steps.sim.outputs.id }} is gone')"
