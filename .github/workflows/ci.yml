# Builds the app and runs unit tests on every PR that touches app code. Branch
# protection requires the "Unit Tests (iOS 26)" and "Unit Tests (iOS 18)"
# checks plus "Unit Tests Gate", which fails on drafts because the test jobs
# skip there and a skipped job still reads as passing. ci-noop.yml provides the
# same check names for PRs that don't touch app code. UI tests are too slow to
# gate a PR (~50 min) — they run nightly in ui-tests.yml.
name: CI

on:
  pull_request:
    branches: [main]
    # The defaults plus ready_for_review: the test jobs skip draft PRs, so
    # leaving draft has to start the run that a push would otherwise wait for.
    types: [opened, synchronize, reopened, ready_for_review]
    # The whole workflows directory rather than this file and its noop twin:
    # naming files individually means ci-noop.yml's paths-ignore has to be kept
    # in lockstep, and any file missed from both fires *both* workflows, which
    # reports each required check twice — a 5-second ubuntu noop can then
    # satisfy a check the real macOS job is still running.
    paths:
      - "Actuali/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Rapid pushes to the same PR cancel the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The test jobs below skip draft PRs, and GitHub treats a skipped job as a
  # passing check: without this gate a draft's head commit satisfies the
  # required checks with nothing run, and keeps that green in the moment
  # between ready_for_review and the new run's checks registering. Failing on
  # drafts keeps the commit red until the real run replaces it. It only counts
  # once listed in the required checks; ci-noop.yml reports the same name for
  # PRs that don't touch app code.
  tests-gate:
    name: Unit Tests Gate
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.pull_request.draft }}
        run: |
          echo "Draft PR: unit tests were skipped. Mark it ready for review to run them." >&2
          exit 1

  # Fails the PR if Swift code isn't formatted per .swiftformat. Kept as its
  # own job (not folded into the test jobs) so branch protection can require
  # "SwiftFormat" by name. ci-noop.yml reports the same check for PRs that
  # don't touch app code.
  # Pinned release artifact: brew's rolling latest once added default-on rules
  # (0.64.0 did) and reddened every open PR. Upgrading is now deliberate:
  # bump the version here, `brew upgrade swiftformat && swiftformat Actuali`
  # locally (brew pin swiftformat holds local to the same release), and land
  # the mechanical reformat in the same PR.
  swiftformat:
    name: SwiftFormat
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTFORMAT_VERSION: 0.64.0
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o swiftformat.zip
      - run: ./swiftformat --lint --strict Actuali

  # Skipped on draft PRs: a draft can't merge, and each push to one would
  # otherwise spend two macOS test runs on work in progress. SwiftFormat still
  # runs there, since it's quick; tests-gate above is what keeps the skip from
  # reading as a pass. The negation keeps workflow_dispatch running: there is
  # no PR there, and `!null` is true.
  #
  # One leg per pinned runtime. iOS 18 is the IPHONEOS_DEPLOYMENT_TARGET floor:
  # the compiler rejects an unavailable API, but a missing SF Symbol or a
  # behaviour difference only shows up when the tests actually run there.
  # The names are the required checks, so they must stay "Unit Tests (iOS N)".
  # fail-fast off: each leg reports on its own, as separate jobs did.
  test:
    name: Unit Tests (iOS ${{ matrix.ios }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            download: "26.5"
          - ios: 18
            download: "18.5"
    # Xcode 27 image: the widgets use the iOS 27 SDK (systemExtraLargePortrait),
    # which Xcode 26 lacks, and Xcode 27 needs macOS 26.6+, so neither macos-26
    # nor macos-15 can build them. The image ships only iOS 27 runtimes, so
    # each leg downloads its own (~9 GB, a few minutes).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The image defaults to an older Xcode 27; pin the release used locally
      # so CI and local builds compile with the same SDK.
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Select iOS ${{ matrix.ios }} simulator
        id: sim
        env:
          IOS: ${{ matrix.ios }}
          DOWNLOAD: ${{ matrix.download }}
        run: |
          runtime() {
            xcrun simctl list runtimes --json \
              | jq -r --arg ios "iOS-$IOS-" '[.runtimes[] | select(.isAvailable) | select(.identifier | contains($ios))][0].identifier'
          }
          RT=$(runtime)
          if [ -z "$RT" ] || [ "$RT" = "null" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$DOWNLOAD"
            RT=$(runtime)
          fi
          if [ -z "$RT" ] || [ "$RT" = "null" ]; then
            echo "No iOS $IOS runtime available and the download did not provide one" >&2
            exit 1
          fi
          SIM_ID=$(xcrun simctl list devices available --json \
            | jq -r --arg rt "$RT" '[.devices[$rt][]? | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            # From the runtime's own supported list: the image's newest iPhone
            # device types don't run on older runtimes.
            DEVICE_TYPE=$(xcrun simctl list runtimes --json \
              | jq -r --arg rt "$RT" '[.runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes[] | select(.productFamily == "iPhone")][0].identifier')
            SIM_ID=$(xcrun simctl create "ci-ios$IOS" "$DEVICE_TYPE" "$RT")
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      # UI tests run nightly in ui-tests.yml so the PR signal stays fast.
      # Simulator builds are ad-hoc signed, so no certificate is needed —
      # but don't pass CODE_SIGNING_ALLOWED=NO: an unsigned test host can't
      # reach the simulator keychain (errSecMissingEntitlement in
      # EncryptionKeyManager tests).
      # xcbeautify (preinstalled on macOS runners) keeps the log readable;
      # --quiet drops passing-task noise but keeps warnings and errors;
      # pipefail preserves xcodebuild's exit code through the pipe.
      - name: Build and run unit tests on iOS ${{ matrix.ios }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Actuali/Actuali.xcodeproj \
            -scheme Actuali \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -testLanguage en \
            -testRegion US \
            -skip-testing:ActualiUITests \
            | xcbeautify --quiet
