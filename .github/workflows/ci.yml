# Builds the app and runs unit tests on every PR that touches app code. Branch
# protection requires the "Unit Tests (iOS 26)" and "Unit Tests (iOS 18)"
# checks; ci-noop.yml provides the same check names for PRs that don't touch
# app code. UI tests are too slow to gate a PR (~50 min) — they run nightly in
# ui-tests.yml.
#
# Which leg runs when. Both legs run the whole suite and they run in parallel,
# so the PR wall-clock is whichever is slower — measured over four recent runs,
# the iOS 18 leg was slower by between 0 and 105 seconds, so taking it off the
# PR path buys about a minute, not the 4-5 the first draft of this expected.
# It runs nightly instead:
#
#   pull_request              → iOS 26
#   nightly schedule          → iOS 18
#   manual dispatch           → both
#
# For a PR that touches SQL, SF Symbols or @available code, check the floor with
# `gh workflow run ci.yml --ref <branch>`, which runs both legs against the
# branch head. A label cannot do this: `pull_request` with no `types` list only
# fires on open, synchronize and reopen, so a label added afterwards starts
# nothing and the job stays skipped — and a skipped job reports Success, which
# would look like a passing floor check.
#
# So the iOS 18 job is skipped on most PRs. A job skipped by an `if` reports
# Success, so the required check is still satisfied (this is the job-level case;
# a whole skipped *workflow* would leave the check pending forever).
name: CI

on:
  pull_request:
    branches: [main]
    # The whole workflows directory rather than this file and its noop twin:
    # naming files individually means ci-noop.yml's paths-ignore has to be kept
    # in lockstep, and any file missed from both fires *both* workflows, which
    # reports each required check twice — a 5-second ubuntu noop can then
    # satisfy a check the real macOS job is still running.
    paths:
      - "Actuali/**"
      - ".github/workflows/**"
  schedule:
    # 13:17 UTC, an hour before ui-tests.yml's 14:00, so the nightly floor check
    # is done before the UI suite starts competing for runners.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Rapid pushes to the same PR cancel the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the PR if Swift code isn't formatted per .swiftformat. Kept as its
  # own job (not folded into the test jobs) so branch protection can require
  # "SwiftFormat" by name. ci-noop.yml reports the same check for PRs that
  # don't touch app code.
  # ponytail: brew installs the latest swiftformat, so a new release that
  # changes output can redden CI until everyone upgrades — pin to a release
  # artifact if that actually happens.
  swiftformat:
    name: SwiftFormat
    # main is already formatted, since this is required on every PR that touches
    # app code, so the nightly run would burn a macOS runner for no signal.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftformat
      - run: swiftformat --lint --strict Actuali

  test-ios26:
    name: Unit Tests (iOS 26)
    # Not on the nightly schedule: that run is for the floor.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Caches the package checkouts, not DerivedData. DerivedData is not worth
      # caching here: the checkout rewrites every source file's mtime, and the
      # build system keys reuse off mtime, so it recompiles everything anyway.
      # Measured locally: a warm no-change build takes 12s, the same build after
      # touching every source takes 50s, and the ~1 GB round-trip costs about
      # what that saves. The checkouts are the part worth caching — resolving
      # the graph and cloning GRDB and friends is network bound, and that is
      # also where the "Resolve Package Graph" hang (papercut pc-0007) shows up.
      # Keyed on the project file so a target or dependency change misses on
      # purpose. The toolchain is deliberately not in the key: checkouts are
      # plain source, so an Xcode bump should not evict them. The runner image
      # is in the key because runner.os is "macOS" for macos-15 and macos-26
      # alike, and two legs computing one key would race to save it.
      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: .spm-packages
          key: spm-macos26-${{ hashFiles('Actuali/Actuali.xcodeproj/project.pbxproj') }}
          restore-keys: spm-macos26-

      # Pinned to iOS 26 rather than "first available iPhone": paired with the
      # test-ios18 job, that names which runtime each leg actually covers. The
      # runner image ships iOS 26, so this never needs a runtime download.
      - name: Select iOS 26 simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            echo "No available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      # UI tests run nightly in ui-tests.yml so the PR signal stays fast.
      # Simulator builds are ad-hoc signed, so no certificate is needed —
      # but don't pass CODE_SIGNING_ALLOWED=NO: an unsigned test host can't
      # reach the simulator keychain (errSecMissingEntitlement in
      # EncryptionKeyManager tests).
      # xcbeautify (preinstalled on macOS runners) keeps the log readable;
      # --quiet drops passing-task noise but keeps warnings and errors;
      # pipefail preserves xcodebuild's exit code through the pipe.
      #
      # No -parallel-testing-enabled here: it needs more than one test bundle to
      # shard into, and this suite is one Swift Testing bundle. Measured with the
      # flag on and a worker count of 3, all 3,077 tests still ran on "Clone 1",
      # an extra simulator clone was booted for nothing, and the wall clock was
      # the same. The suite already parallelizes inside its process.
      - name: Build and run unit tests on iOS 26
        run: |
          set -o pipefail
          xcodebuild test \
            -project Actuali/Actuali.xcodeproj \
            -scheme Actuali \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -testLanguage en \
            -testRegion US \
            -skip-testing:ActualiUITests \
            | xcbeautify --quiet

  # IPHONEOS_DEPLOYMENT_TARGET is 18.0, so the floor needs a runtime of its
  # own: the compiler rejects an unavailable API, but a missing SF Symbol or
  # a behaviour difference only shows up when the tests actually run there.
  # It runs nightly rather than on every PR (see the header for the numbers), or
  # on demand with `gh workflow run ci.yml --ref <branch>`.
  # macos-15 rather than macos-26: its image ships iOS 18 runtimes and devices
  # alongside Xcode 26, which saves the ~9 GB runtime download macos-26 needs
  # (~4 min, plus a slower build while the fresh runtime settles). The
  # download below stays as a fallback for when the image drops them.
  test-ios18:
    name: Unit Tests (iOS 18)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # macos-15 defaults to Xcode 16, which lacks the iOS 26 SDK. Take the
      # newest Xcode 26 on the image rather than pinning one the image may
      # later prune; the iOS 26 leg still builds on the current toolchain.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      # Same as the iOS 26 leg's cache, under the macos-15 key (see the comment
      # there for why the key is per-image and not per-toolchain).
      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: .spm-packages
          key: spm-macos15-${{ hashFiles('Actuali/Actuali.xcodeproj/project.pbxproj') }}
          restore-keys: spm-macos15-

      - name: Select iOS 18 simulator
        id: sim
        run: |
          runtime() {
            xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.isAvailable) | select(.identifier | contains("iOS-18"))][0].identifier'
          }
          RT=$(runtime)
          if [ -z "$RT" ] || [ "$RT" = "null" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
            RT=$(runtime)
          fi
          if [ -z "$RT" ] || [ "$RT" = "null" ]; then
            echo "No iOS 18 runtime available and the download did not provide one" >&2
            exit 1
          fi
          SIM_ID=$(xcrun simctl list devices available --json \
            | jq -r --arg rt "$RT" '[.devices[$rt][]? | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")][-1].identifier')
            SIM_ID=$(xcrun simctl create ci-ios18 "$DEVICE_TYPE" "$RT")
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests on iOS 18
        run: |
          set -o pipefail
          xcodebuild test \
            -project Actuali/Actuali.xcodeproj \
            -scheme Actuali \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -testLanguage en \
            -testRegion US \
            -skip-testing:ActualiUITests \
            | xcbeautify --quiet
