# Temporary workflow used only to apply the reviewed fixes; it deletes itself after the change.
name: Fix category funding review findings

on:
  push:
    branches: [New-Category-Funding-Automation-Fixed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/New-Category-Funding-Automation-Fixed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              found = s.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}')
              p.write_text(s.replace(old, new, count))

          # Fix BudgetStore attribute indentation only.
          bs = root / 'Actuali/Actuali/Services/BudgetStore.swift'
          s = bs.read_text()
          s = s.replace('      @discardableResult\nfunc saveTransaction(', '    @discardableResult\n    func saveTransaction(', 1)
          bs.write_text(s)

          # Keep automation serialized in the existing @MainActor model. The
          # queued task weakly captures the store, and only saved IDs/defaults
          # are retained while waiting; there is no global service queue.
          ca_path = 'Actuali/Actuali/Services/CategoryFundingAutomation.swift'
          ca = root / ca_path
          s = ca.read_text()
          replace(ca_path, '''    @MainActor\n    static func processIfNeeded(\n        _ savedTransactionId: String?,\n        using budgetStore: BudgetStore,\n        defaults: UserDefaults = .standard\n    ) {\n        guard let savedTransactionId else { return }\n        Task { @MainActor in\n            await process(\n                savedTransactionId: savedTransactionId,\n                using: budgetStore,\n                defaults: defaults\n            )\n        }\n    }''', '''    @MainActor\n    static func processIfNeeded(\n        _ savedTransactionId: String?,\n        using budgetStore: BudgetStore,\n        defaults: UserDefaults = .standard\n    ) {\n        guard let savedTransactionId else { return }\n        budgetStore.enqueueCategoryFunding(\n            savedTransactionId: savedTransactionId,\n            defaults: defaults\n        )\n    }''')
          replace(ca_path, '''        guard let configuration = loadConfiguration(\n            for: budgetStore.currentBudgetId,\n            defaults: defaults\n        ), configuration.isEnabled,''', '''        let processingBudgetId = budgetStore.currentBudgetId\n        guard let processingBudgetId,\n              let configuration = loadConfiguration(\n            for: processingBudgetId,\n            defaults: defaults\n        ), configuration.isEnabled,''')
          replace(ca_path, '''        case .fund(let amountToFund):\n            let displayedMonth = budgetStore.currentBudgetMonth?.month\n            do {''', '''        case .fund(let amountToFund):\n            guard budgetStore.currentBudgetId == processingBudgetId else { return }\n            let displayedMonth = budgetStore.currentBudgetMonth?.month\n            do {''')

          # The settings source picker must not be coupled to BudgetView's
          # currently displayed month. Runtime processing validates balance in
          # the transaction's own month.
          settings_path = 'Actuali/Actuali/Views/Settings/CategoryFundingAutomationView.swift'
          replace(settings_path, '''    /// Categories with money, plus the saved source so a drained source is\n    /// not silently replaced with To Budget. The automation re-checks the\n    /// source balance when it actually runs.\n    private var fundingCategories: [CategoryBudget] {\n        var savedId: String?\n        if case .category(let id) = configuration.fundingSource {\n            savedId = id\n        }\n\n        return (budgetStore.currentBudgetMonth?.allCategoryBudgets ?? [])\n            .filter { $0.available > 0 || $0.categoryId == savedId }\n            .sorted {\n                $0.categoryName.localizedCaseInsensitiveCompare($1.categoryName) == .orderedAscending\n            }\n    }''', '''    /// Every non-income category is a valid configured source. The automation\n    /// checks the source balance again for the transaction's own month, so the\n    /// settings screen must not depend on the month the Budget tab is viewing.\n    private var fundingCategories: [Category] {\n        budgetStore.categoryGroups\n            .flatMap(\\.categories)\n            .filter { !$0.isIncome && !$0.hidden }\n            .sorted {\n                $0.name.localizedCaseInsensitiveCompare($1.name) == .orderedAscending\n            }\n    }''')
          sp = root / settings_path
          s = sp.read_text().replace('ForEach(fundingCategories, id: \\.categoryId) { category in', 'ForEach(fundingCategories, id: \\.id) { category in')
          sp.write_text(s)

          # Regression coverage for split children.
          test_path = 'Actuali/ActualiTests/Services/CategoryFundingAutomationTests.swift'
          replace(test_path, '''    @Test("Deleted transactions are ignored")\n    func deletedTransaction() {''', '''    @Test("Split children are ignored")\n    func splitChild() {\n        var transaction = makeTransaction(categoryId: "groceries")\n        transaction.parentId = "split-parent"\n        #expect(!CategoryFundingAutomation.shouldProcess(\n            transaction,\n            selectedAccountId: "account-1",\n            isIncomeCategory: false\n        ))\n    }\n\n    @Test("Deleted transactions are ignored")\n    func deletedTransaction() {''')

          # Regression coverage for the saveTransaction optional-ID contract.
          save_path = 'Actuali/ActualiTests/Services/BudgetStore/BudgetStoreSaveTransactionTests.swift'
          replace(save_path, '''    @Test func savingANewOffBudgetTransactionDropsCategoriesAndSplits() async throws {''', '''    @Test func editingATransactionReturnsNoCreatedID() async throws {\n        let (database, path) = try makeDatabase()\n        defer { cleanup(path) }\n        let store = try await makeStore(database: database)\n        let original = transaction(payeeId: nil, payeeName: nil)\n        try database.insertTransaction(original)\n\n        let id = try await store.saveTransaction(\n            form(type: .expense, amount: "10.50", payeeName: "Updated"),\n            editing: original\n        )\n        #expect(id == nil)\n    }\n\n    @Test func savingATransferReturnsNoCreatedID() async throws {\n        let (database, path) = try makeDatabase()\n        defer { cleanup(path) }\n        let store = try await makeStore(database: database)\n        store.accounts = [\n            Account(id: "acct-1", name: "Checking", type: .checking, offBudget: false, closed: false, sortOrder: 0, balance: 0),\n            Account(id: "acct-2", name: "Savings", type: .savings, offBudget: false, closed: false, sortOrder: 1, balance: 0)\n        ]\n        let id = try await store.saveTransaction(\n            form(type: .transfer, amount: "25.00", transferToAccountId: "acct-2")\n        )\n        #expect(id == nil)\n    }\n\n    @Test func savingANewOffBudgetTransactionDropsCategoriesAndSplits() async throws {''')

          # Test the new settings screen's reachable configuration surface.
          ui_path = root / 'Actuali/ActualiUITests/CategoryFundingAutomationUITests.swift'
          ui_path.write_text('''import XCTest\n\nfinal class CategoryFundingAutomationUITests: XCTestCase {\n    @MainActor\n    func testCategoryFundingSettingsCanBeConfigured() throws {\n        let app = XCUIApplication()\n        app.launchArguments = ["-loadDemoData", "-initialTab", "4"]\n        app.launch()\n\n        let automation = app.staticTexts["Category Funding Settings"]\n        XCTAssertTrue(automation.waitForExistence(timeout: 10), "Category Funding Settings row not found")\n        automation.tap()\n\n        XCTAssertTrue(app.navigationBars["Category Funding"].waitForExistence(timeout: 5), "Category Funding screen did not open")\n\n        let accountPicker = app.buttons["Account"]\n        XCTAssertTrue(accountPicker.waitForExistence(timeout: 5), "Account picker not found")\n        accountPicker.tap()\n\n        let checking = app.buttons["Chase Checking"]\n        XCTAssertTrue(checking.waitForExistence(timeout: 5), "Demo account not available in picker")\n        checking.tap()\n\n        let enable = app.switches["Enable Automation"]\n        XCTAssertTrue(enable.waitForExistence(timeout: 5), "Enable Automation toggle not found")\n        XCTAssertTrue(enable.isEnabled, "Enable Automation should be enabled after choosing an account")\n    }\n}\n''')
          PY

          python3 <<'PY'
          from pathlib import Path
          p = Path('Actuali/Actuali/Services/BudgetStore.swift')
          s = p.read_text()
          anchor = 'final class BudgetStore: ObservableObject {\n'
          addition = '''final class BudgetStore: ObservableObject {\n    private var categoryFundingTask: Task<Void, Never>?\n\n    func enqueueCategoryFunding(\n        savedTransactionId: String,\n        defaults: UserDefaults\n    ) {\n        let previousTask = categoryFundingTask\n        categoryFundingTask = Task { @MainActor [weak self] in\n            _ = await previousTask?.result\n            guard let self else { return }\n            await CategoryFundingAutomation.process(\n                savedTransactionId: savedTransactionId,\n                using: self,\n                defaults: defaults\n            )\n        }\n    }\n'''
          if s.count(anchor) != 1: raise SystemExit('BudgetStore class anchor missing')
          p.write_text(s.replace(anchor, addition, 1))
          PY

          git add Actuali
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address category funding review findings'
          git push

          git rm .github/workflows/fix-category-funding-review.yml
          git commit -m 'chore: remove temporary review fix workflow'
          git push
