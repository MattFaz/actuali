name: One-off history P2 cleanup

on:
  push:
    branches: [history-clean]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history-clean
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply and commit localization key
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Actuali/Actuali/Localizable.xcstrings")
          text = path.read_text(encoding="utf-8")
          key = "%@ → %@"
          if f'"{key}":' in text:
              raise SystemExit("transfer detail localization key already exists")

          match = re.search(r'(?m)^(    )"strings": \{', text)
          if not match:
              raise SystemExit("could not find strings object")
          open_brace = text.find("{", match.start())

          depth = 0
          in_string = False
          escaped = False
          close_brace = None
          for i in range(open_brace, len(text)):
              ch = text[i]
              if in_string:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  continue
              if ch == '"':
                  in_string = True
              elif ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break
          if close_brace is None:
              raise SystemExit("could not find end of strings object")

          entry = '''
    "%s": {
      "localizations": {
        "de": {"stringUnit": {"state": "translated", "value": "%s"}},
        "en": {"stringUnit": {"state": "translated", "value": "%s"}},
        "es": {"stringUnit": {"state": "translated", "value": "%s"}},
        "fr": {"stringUnit": {"state": "translated", "value": "%s"}},
        "it": {"stringUnit": {"state": "translated", "value": "%s"}},
        "nl": {"stringUnit": {"state": "translated", "value": "%s"}},
        "pt-BR": {"stringUnit": {"state": "translated", "value": "%s"}}
      }
    },
''' % ((key,) + (key,) * 7)

          before_close = text[:close_brace].rstrip()
          suffix = text[close_brace:]
          if before_close.endswith(","):
              new_text = before_close + "\n" + entry.rstrip("\n") + "\n" + suffix.lstrip("\n")
          else:
              new_text = before_close + ",\n" + entry.rstrip("\n") + "\n" + suffix.lstrip("\n")
          path.write_text(new_text, encoding="utf-8")
          PY
          git add Actuali/Actuali/Localizable.xcstrings
          git commit -m "Localize history transfer detail format"
          git push origin HEAD:history-clean

      - name: Remove duplicate localization entries and simplify restore API
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          catalog = Path("Actuali/Actuali/Localizable.xcstrings")
          text = catalog.read_text(encoding="utf-8")

          def remove_last_object(source: str, key: str) -> str:
              matches = list(re.finditer(r'(?m)^(    )"' + re.escape(key) + r'": \{', source))
              if len(matches) < 2:
                  raise SystemExit(f"expected duplicate catalog key: {key}")
              start = matches[-1].start()
              open_brace = source.find("{", matches[-1].start())
              depth = 0
              in_string = False
              escaped = False
              end = None
              for i in range(open_brace, len(source)):
                  ch = source[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f"could not find end of duplicate key: {key}")
              if end < len(source) and source[end] == ',':
                  end += 1
              if end < len(source) and source[end] == '\n':
                  end += 1
              return source[:start] + source[end:]

          for key in ("Uncategorized", "Account", "Note"):
              text = remove_last_object(text, key)
          catalog.write_text(text, encoding="utf-8")
          PY
          git add Actuali/Actuali/Localizable.xcstrings
          git commit -m "Remove duplicate history localization entries"
          git push origin HEAD:history-clean

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Actuali/Actuali/Services/BudgetStore.swift")
          text = path.read_text(encoding="utf-8")
          start = text.find("    /// Restore several transaction rows as one sync write.\n")
          end = text.find("    /// Publish rows that have just been committed before the normal refresh.\n", start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate restoreTransactions block")
          replacement = '''    /// Restore one transaction row to a recorded earlier state. Only the
    /// fields that actually changed are written, so an unchanged field does
    /// not get a fresh HLC timestamp that can clobber a concurrent edit.
    func restoreTransaction(_ transaction: Transaction, from recordedAfter: Transaction) async throws {
        guard let syncClient else { throw BudgetStoreError.syncNotConfigured }
        let fields = Self.changedFields(original: recordedAfter, updated: transaction)
        guard !fields.isEmpty else { return }
        try await syncClient.updateTransaction(transaction, changedFields: fields)
        await refreshDataOnly()
    }

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          extension_path = Path("Actuali/Actuali/Services/BudgetStore+History.swift")
          if extension_path.exists():
              extension_path.unlink()

          if "restoreTransactions(" in text:
              raise SystemExit("restoreTransactions still exists in BudgetStore.swift")
          PY
          git add -A Actuali/Actuali/Services/BudgetStore.swift Actuali/Actuali/Services/BudgetStore+History.swift
          git commit -m "Simplify history transaction restore API"
          git push origin HEAD:history-clean

      - name: Verify cleanup
        run: |
          test ! -e Actuali/Actuali/Services/BudgetStore+History.swift
          ! grep -R "HistoryTransactionSnapshot\|HistorySplitPortionSnapshot" Actuali/Actuali/Services Actuali/ActualiTests/Services/History
          ! grep -R "HistoryStore\.shared\.record(" Actuali/Actuali/Services/HistoryObserver.swift Actuali/ActualiTests/Services/History
          ! grep -R "restoreTransactions(" Actuali/Actuali/Services Actuali/ActualiTests/Services/History

      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/oneoff-history-p2.yml
          git commit -m "Remove one-off history P2 cleanup workflow"
          git push origin HEAD:history-clean
