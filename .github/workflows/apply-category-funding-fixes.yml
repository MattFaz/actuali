name: Apply final category funding fixes

on:
  push:
    branches: [New-Category-Funding-Automation-Fixed]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              found = s.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}')
              p.write_text(s.replace(old, new, count))

          # Fix the indentation from the earlier automated patch.
          p = root / 'Actuali/Actuali/Services/BudgetStore.swift'
          s = p.read_text().replace('      @discardableResult\n    func saveTransaction(', '    @discardableResult\n    func saveTransaction(', 1)
          p.write_text(s)

          # Capture the expected budget at enqueue time. A save queued while
          # budget A is open must be discarded if the user switches budgets
          # before that save's automation gets its turn.
          replace(
              'Actuali/Actuali/Services/BudgetStore.swift',
              '''    func enqueueCategoryFunding(\n        savedTransactionId: String,\n        defaults: UserDefaults\n    ) {''',
              '''    func enqueueCategoryFunding(\n        savedTransactionId: String,\n        budgetId: String,\n        defaults: UserDefaults\n    ) {'''
          )
          replace(
              'Actuali/Actuali/Services/BudgetStore.swift',
              '''            await CategoryFundingAutomation.process(\n                savedTransactionId: savedTransactionId,\n                using: self,\n                defaults: defaults\n            )''',
              '''            await CategoryFundingAutomation.process(\n                savedTransactionId: savedTransactionId,\n                using: self,\n                defaults: defaults,\n                expectedBudgetId: budgetId\n            )'''
          )

          replace(
              'Actuali/Actuali/Services/CategoryFundingAutomation.swift',
              '''        guard let savedTransactionId else { return }\n        budgetStore.enqueueCategoryFunding(\n            savedTransactionId: savedTransactionId,\n            defaults: defaults\n        )''',
              '''        guard let savedTransactionId, let budgetId = budgetStore.currentBudgetId else { return }\n        budgetStore.enqueueCategoryFunding(\n            savedTransactionId: savedTransactionId,\n            budgetId: budgetId,\n            defaults: defaults\n        )'''
          )
          replace(
              'Actuali/Actuali/Services/CategoryFundingAutomation.swift',
              '''    static func process(\n        savedTransactionId: String,\n        using budgetStore: BudgetStore,\n        defaults: UserDefaults = .standard\n    ) async {\n        let processingBudgetId = budgetStore.currentBudgetId\n        guard let processingBudgetId,\n              let configuration = loadConfiguration(\n            for: processingBudgetId,''',
              '''    static func process(\n        savedTransactionId: String,\n        using budgetStore: BudgetStore,\n        defaults: UserDefaults = .standard,\n        expectedBudgetId: String? = nil\n    ) async {\n        let processingBudgetId = budgetStore.currentBudgetId\n        guard let processingBudgetId,\n              expectedBudgetId == nil || expectedBudgetId == processingBudgetId,\n              let configuration = loadConfiguration(\n            for: processingBudgetId,'''
          )

          # Add direct coverage for the second half of the parent/child guard.
          replace(
              'Actuali/ActualiTests/Services/CategoryFundingAutomationTests.swift',
              '''    @Test("Deleted transactions are ignored")\n    func deletedTransaction() {''',
              '''    @Test("Split children are ignored")\n    func splitChild() {\n        var transaction = makeTransaction(categoryId: "groceries")\n        transaction.parentId = "split-parent"\n        #expect(!CategoryFundingAutomation.shouldProcess(\n            transaction,\n            selectedAccountId: "account-1",\n            isIncomeCategory: false\n        ))\n    }\n\n    @Test("Deleted transactions are ignored")\n    func deletedTransaction() {'''
          ) if '    @Test("Split children are ignored")\n' not in (root / 'Actuali/ActualiTests/Services/CategoryFundingAutomationTests.swift').read_text() else None

          # Add explicit no-ID coverage for a split save too; the callback must
          # not start funding when an edit mutates an existing row graph.
          save_path = 'Actuali/ActualiTests/Services/BudgetStore/BudgetStoreSaveTransactionTests.swift'
          text = (root / save_path).read_text()
          if 'func editingASplitReturnsNoCreatedID()' not in text:
              marker = '    @Test func savingATransferReturnsNoCreatedID() async throws {'
              insert = '''    @Test func editingASplitReturnsNoCreatedID() async throws {\n        let (database, path) = try makeDatabase()\n        defer { cleanup(path) }\n        let store = try await makeStore(database: database)\n        let original = transaction(payeeId: nil, payeeName: nil)\n        var splitForm = form(type: .expense, amount: "10.50", payeeName: "Updated")\n        splitForm.splits = [\n            .init(categoryId: "cat-food", amount: "5.25"),\n            .init(categoryId: "cat-fun", amount: "5.25")\n        ]\n\n        let id = try await store.saveTransaction(splitForm, editing: original)\n        #expect(id == nil)\n    }\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit('split save test marker missing')
              text = text.replace(marker, insert + marker, 1)
              (root / save_path).write_text(text)

          # Verify the UI test source list and assertion are type-correct at the
          # text level before handing it to Xcode.
          ui = root / 'Actuali/ActualiUITests/CategoryFundingAutomationUITests.swift'
          text = ui.read_text()
          text = text.replace('let automation = app.staticTexts["Category Funding Settings"]', 'let automation = app.buttons["Category Funding Settings"]')
          ui.write_text(text)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Actuali
          git commit -m 'fix: finalize category funding review findings'
          git push

          git rm .github/workflows/apply-category-funding-fixes.yml
          git commit -m 'chore: remove temporary review workflow'
          git push
