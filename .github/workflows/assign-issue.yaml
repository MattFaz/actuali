name: Assign Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: takanome-dev/assign-issue-action@v3.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          self_assign_cmd: "/assign-me"
          self_unassign_cmd: "/unassign-me"
          assigned_text: "Thanks for taking this, issue has been assigned to you."
